[package]
name = "localstream-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
base64 = "0.22"
getrandom = "0.3"
keyring = { version = "=3.6.3", features = ["apple-native", "crypto-rust", "linux-native-sync-persistent", "windows-native"] }
rcgen = { version = "=0.14.7", features = ["zeroize"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = "=0.3.36"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4", "v5"] }
walkdir = "2"

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
